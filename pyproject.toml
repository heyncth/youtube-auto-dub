[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-auto-dub"
version = "2.0.0"
description = "Automated YouTube video dubbing and subtitling pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1",
    "torch>=2.0",
    "yt-dlp>=2024.12.0",
    "soundfile>=0.12",
    "edge-tts>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "rich>=13.0",
]

[project.scripts]
youtube-auto-dub = "youtube_auto_dub.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["youtube_auto_dub*"]

[tool.setuptools.package-data]
youtube_auto_dub = ["language_map.json"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
